---
- name: Set timezone to UTC
  ansible.windows.win_timezone:
    timezone: UTC

- name: Enable ICMP echo request (ping) through Windows Firewall
  community.windows.win_firewall_rule:
    name: Allow ICMPv4
    enabled: true
    state: present
    protocol: icmpv4
    action: allow
    direction: in

# The virtio-win ISO is only attached during the Packer build (see
# additional_iso_files in each Windows build) and its drive letter
# can vary; find the installer rather than hardcoding a path or MSI
# product code.
- name: Locate the QEMU guest agent installer on the virtio-win media
  ansible.windows.win_find:
    paths: ['C:\', 'D:\', 'E:\', 'F:\']
    patterns: ['qemu-ga-x86_64.msi']
    recurse: true
    depth: 3
  register: windows_common_qemu_ga_installer

- name: Install QEMU guest agent
  ansible.windows.win_package:
    path: "{{ windows_common_qemu_ga_installer.files[0].path }}"
    state: present
    arguments: /qn
  when: windows_common_qemu_ga_installer.matched > 0

- name: Enable Remote Desktop
  ansible.windows.win_shell: |
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
    Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

- name: Set power plan to High Performance
  ansible.windows.win_shell: powercfg /setactive SCHEME_MIN

# OpenSSH Server comes with Windows Server 2025. On Windows 11 it is a Feature on Demand that Windows downloads from
# Windows Update when it is added, which can take half an hour or more on each clone. Installing it here means every
# Windows template has it. It is installed before the updates below, which then patch it too.
- name: Install OpenSSH Server
  ansible.windows.win_capability:
    name: OpenSSH.Server~~~~0.0.1.0
    state: present
  register: windows_common_openssh

- name: Restart to finish installing OpenSSH Server
  ansible.windows.win_reboot:
  when: windows_common_openssh.reboot_required

# sshd generates its host keys the first time it starts, and every clone would then share them. Keep it disabled in
# the template, as Server 2025 ships it, and remove any keys. ans-features enables and starts it on each VM.
- name: Keep sshd stopped and disabled in the template
  ansible.windows.win_service:
    name: sshd
    start_mode: disabled
    state: stopped

- name: Remove any SSH host keys
  ansible.windows.win_shell: |
    $keys = Get-ChildItem -Path "$env:ProgramData\ssh\ssh_host_*" -ErrorAction SilentlyContinue
    if ($keys) {
        $keys | Remove-Item -Force
        'removed'
    }
  register: windows_common_ssh_host_keys
  changed_when: "'removed' in windows_common_ssh_host_keys.stdout"

# Desktop Experience and Windows 11: Windows 24H2/Server 2025 can start a new user's
# first shell before its system app packages are registered, crashing
# explorer.exe into a black screen. Every account on a clone is new, so
# register them at each logon (no-op once present). See the script header.
- name: Check for the shell app packages (Desktop Experience)
  ansible.windows.win_stat:
    path: C:\Windows\SystemApps\MicrosoftWindows.Client.CBS_cw5n1h2txyewy\appxmanifest.xml
  register: windows_common_shell_packages

- name: Create the vm-templates script directory
  ansible.windows.win_file:
    path: C:\ProgramData\vm-templates
    state: directory
  when: windows_common_shell_packages.stat.exists

- name: Install the shell package registration script
  ansible.windows.win_copy:
    src: Register-ShellPackages.ps1
    dest: C:\ProgramData\vm-templates\Register-ShellPackages.ps1
  when: windows_common_shell_packages.stat.exists

- name: Register the shell app packages at every user logon
  community.windows.win_scheduled_task:
    name: Register shell app packages
    path: \vm-templates
    description: Registers system app packages explorer.exe needs for new profiles (Windows 24H2 first-logon bug).
    actions:
      - path: powershell.exe
        arguments: >-
          -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass
          -File C:\ProgramData\vm-templates\Register-ShellPackages.ps1
    triggers:
      - type: logon
    logon_type: group
    group: BUILTIN\Users
    run_level: limited
    state: present
    enabled: true
  when: windows_common_shell_packages.stat.exists

# Templates ship with every update available when they are built. win_updates restarts Windows when an update needs
# it and keeps searching, and the loop runs it again until a search finds nothing, so updates that only appear after
# others are installed (a servicing stack update, then the cumulative update) are included. A failed update fails
# the build rather than producing a template that is not fully patched. Windows must not be left waiting for a
# restart either, because sysprep refuses to run then.
- name: Install Windows updates
  ansible.windows.win_updates:
    category_names: "{{ windows_common_update_categories }}"
    skip_optional: true
    reboot: true
    reboot_timeout: 3600
  register: windows_common_updates
  until:
    - windows_common_updates is not failed
    - windows_common_updates.found_update_count == 0
  retries: 5
  delay: 30
