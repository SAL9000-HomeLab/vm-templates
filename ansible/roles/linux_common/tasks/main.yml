---
- name: Set timezone to UTC
  community.general.timezone:
    name: UTC

- name: Update apt cache and upgrade packages (Debian/Ubuntu)
  ansible.builtin.apt:
    update_cache: true
    upgrade: safe
  when: ansible_os_family == "Debian"

# A golden image should ship fully patched, so upgrading everything is the point.
- name: Upgrade packages (RHEL/Rocky)  # noqa: package-latest
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
  when: ansible_os_family == "RedHat"

- name: Install baseline packages
  ansible.builtin.package:
    name:
      - curl
      - vim
      - chrony
    state: present

- name: Ensure chrony is enabled and running
  ansible.builtin.systemd:
    name: chronyd
    enabled: true
    state: started
  when: ansible_os_family == "RedHat"

- name: Ensure chrony is enabled and running (Debian/Ubuntu)
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started
  when: ansible_os_family == "Debian"

# The templates' disks have discard on, but freed blocks only go back to thin
# storage when the guest trims. Ubuntu and Rocky 10 enable this weekly timer
# already; Rocky 9 ships it disabled.
- name: Ensure fstrim.timer is enabled and running
  ansible.builtin.systemd:
    name: fstrim.timer
    enabled: true
    state: started

# SSH password auth is switched off (and the build account locked) by each
# Packer build's final shell provisioner rather than here, so this role stays
# safe to re-run against deployed VMs.
- name: Harden SSH — disable root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
  notify: Restart sshd
